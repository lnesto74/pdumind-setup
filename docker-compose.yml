version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    ports:
      - "5002:5002"
    volumes:
      - ./data:/app/data
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - PORT=5002
      - HUB_LAN_IP=${HUB_LAN_IP:-}
      - HUB_PORT=${HUB_PORT:-3000}
      - PDUMIND_DEMO_ENABLED=${PDUMIND_DEMO_ENABLED:-}
      - PDUMIND_OPS_ENABLED=${PDUMIND_OPS_ENABLED:-}
      - MAX_SNMP_THREADS=12
      - SNMP_BATCH_SIZE=2
      - OUTLET_BASE_TIMEOUT=3
      - OUTLET_MAX_RETRIES=2
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: always
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: "${BUILD_VERSION:-dev}"
    ports:
      - "3000:3000"
    environment:
      - API_PROXY_TARGET=http://backend:5002
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
volumes:
  pdu_data:
