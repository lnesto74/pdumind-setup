version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./data:/app/data
      - ./backend:/app
    ports:
      - "9000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - MAX_SNMP_THREADS=12
      - SNMP_BATCH_SIZE=2
      - OUTLET_BASE_TIMEOUT=3
      - OUTLET_MAX_RETRIES=2
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: always
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

    depends_on:
      - backend
volumes:
  pdu_data:
